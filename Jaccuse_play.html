<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play J'accuse! - Pustezug Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="icon_folder/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon_folder/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon_folder/favicon-16x16.png">
    <link rel="manifest" href="icon_folder/site.webmanifest">
    <link rel="mask-icon" href="icon_folder/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#1a2f3d">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script type="module" src="java_scripts/databank.js" defer></script>
    <script type="module" src="java_scripts/Jaccuse.js" defer></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="java_scripts/google_login.js" defer></script>
    <script type="module">
        import { main } from './java_scripts/Jaccuse.js';
        window.onload = function() {
            main();
            
            // Toggle categories panel
            const toggleBtn = document.getElementById('toggle-categories');
            const panel = document.getElementById('categories-panel');
            
            if (toggleBtn && panel) {
                toggleBtn.addEventListener('click', function() {
                    panel.classList.toggle('collapsed');
                    toggleBtn.classList.toggle('expanded');
                });
            }
        };
    </script>
</head>
<body class="game-page play-page">
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">
                <img src="images/Turtle_logo.png" alt="Pustezug Games Logo">
                <span>Pustezug Games</span>
            </a>
            <ul class="nav-links">
                <li><a href="Jaccuse.html">J'accuse!</a></li>
                <li><a href="Jaccuse.html">Rules</a></li>
                <li><a href="Jaccuse_words.html">Words</a></li>
            </ul>
            <div class="nav-auth">
                <div id="g_id_onload"
                     data-client_id="663759759562-koons6upuoj2n06l9ncf7of7c00b4qhf.apps.googleusercontent.com"
                     data-callback="handleCredentialResponse">
                </div>
                <div class="g_id_signin" data-type="standard"></div>
            </div>
        </div>
    </nav>

    <!-- Play Area -->
    <main class="play-content">
        <header class="play-header">
            <h1>Play J'accuse!</h1>
        </header>

        <section class="play-area">
            <!-- Topic Selection -->
            <div id="topic-selection" class="topic-selection">
                <button id="toggle-categories" class="toggle-categories-btn">
                    <span>Filter Categories</span>
                    <span class="toggle-arrow">▼</span>
                </button>
                <div id="categories-panel" class="categories-panel collapsed">
                    <p class="categories-hint">Click to cycle: neutral → must have (green) → exclude (red)</p>
                    <div id="buttonContainer" class="category-buttons"></div>
                </div>
            </div>

            <!-- Game Controls -->
            <div id="start_options" class="game-controls"></div>

            <!-- Player Cards -->
            <div id="player_cards" class="player-cards-area"></div>

            <!-- Condemned Button -->
            <div id="condemmed_button" class="condemn-controls"></div>
        </section>

        <a href="Jaccuse.html" class="back-link">← Back to J'accuse!</a>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <img src="images/Turtle_logo.png" alt="Pustezug Games">
                <span>Pustezug Games</span>
            </div>
            <div class="footer-links">
                <a href="index.html#games">Games</a>
                <a href="index.html#contact">Contact</a>
                <a href="https://www.admonymous.co/pustezug" target="_blank">Feedback</a>
            </div>
        </div>
    </footer>
</body>
</html>
